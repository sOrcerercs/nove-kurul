# Nove Kurul Ofisi — sunucu paketi. Sırlar (.env) bağlı depodan okunur: servisler dosyayı kendisi
# yükler, buraya sır ya da ortam dosyası yazılmaz. Panel yalnız loopback'te yayınlanır; dışarıya
# ters vekil (deploy/Caddyfile.example) açar.
#
# Veritabanı ayrı bir Docker ağındaysa yazılımcı aşağıdaki iki bloğu açar ve ağ adını yazar:
#
#   x-ortak içine, her servisin altına:   networks: [veritabani]
#   dosyanın sonuna:
#     networks:
#       veritabani:
#         external: true
#         name: <veritabani-agi-adi>
#
# UYARI: panel konteyner içinde her adresten bağlantı alır ve şifresiz HTTP konuşur. Bağlandığı ağdaki
# her konteyner ona doğrudan ulaşır, vekilin IP süzgecini atlar; Docker ağı özel aralıkta olduğu için
# panel o konteyneri vekil sayar ve X-Forwarded-For başlığına güvenir. Bu yüzden veritabani ağında
# YALNIZ veritabanı konteynerleri olmalı; başka uygulamaların bağlı olduğu genel bir ağa bağlamayın.
#
# Vekil (Caddy/nginx) de konteynerdeyse 127.0.0.1:8770'e ulaşamaz. Yalnız vekil ile panelin olduğu ayrı
# bir ağ açılır (docker network create nove-vekil), vekil de ona bağlanır ve hedefi panel:8770 olur:
#
#   panel altına:   networks: [vekil]      (veritabani da gerekiyorsa: [veritabani, vekil])
#   dosyanın sonundaki networks: bloğuna (yoksa açın):
#       vekil:
#         external: true
#         name: nove-vekil
#
# Vekil ağına vekilden başka konteyner bağlanmaz (bkz. deploy/KURULUM.md, "Vekil de konteynerdeyse").
name: nove-kurul
x-ortak: &ortak
  image: nove-kurul:yerel
  working_dir: /srv/nove-kurul
  volumes:
    - "${NOVE_KOK:-/srv/nove-kurul}:/srv/nove-kurul"
    - claude-ev:/home/nove-ajan/.claude
  restart: unless-stopped
  init: true
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
services:
  panel:
    <<: *ortak
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: {UID: "${NOVE_UID:-1000}", GID: "${NOVE_GID:-1000}"}
    command: ["python3", "bin/panel.py", "--adres", "0.0.0.0", "--https-arkasinda"]
    ports: ["127.0.0.1:${NOVE_PORT:-8770}:8770"]
  zamanlayici:
    <<: *ortak
    command: ["supercronic", "deploy/docker/crontab"]
volumes:
  claude-ev:
